services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: keel
      MINIO_ROOT_PASSWORD: keel-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    build: .
    environment:
      PORT: 3000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: keel
      MINIO_SECRET_KEY: keel-local-secret
      MINIO_BUCKET: keel-observability
    ports:
      - "3000:3000"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
